[project]
name = "quantagent"
version = "0.1.1"
description = "Terminal UI quant analysis application"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.4",
    "rich>=15.0.0",
    "pydantic>=2.13.3",
    "typer>=0.24.2",
    "toml>=0.10.2",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.2",
    # LangGraph / deepagents
    "deepagents>=0.5.3,<0.6.0",
    "langchain>=1.2.15",
    "langgraph>=1.1.9",
    "langgraph-checkpoint-sqlite>=3.0.3,<4.0.0",
    "langchain-openai>=1.2.1",
    "langchain-anthropic>=1.4.1",
    "langchain-google-genai>=4.2.2",
    "langchain-openrouter>=0.2.1",
    # Market data
    "yfinance>=1.3.0",
    "alpha-vantage>=3.0.0",
    "polygon-api-client>=1.16.3",
    # Quant
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "pandas-ta>=0.4.71b0",
    "vectorbt>=1.0.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    # Utils
    "uuid-utils>=0.14.1",
    "httpx>=0.28.1",
    "lxml>=6.1.0",
]

[project.scripts]
quantagent = "quantagent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-textual-snapshot>=1.1.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.15.12",
    "mypy>=1.20.2",
    "bandit>=1.9.4",
    "types-toml>=0.10.8.20260408",
    "langgraph-cli[inmem]>=0.4.24",
    "pandas-stubs>=3.0.0.260204",
    "types-requests>=2.33.0.20260408",
    "pyinstaller>=6.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    ".venv",
    "tests",
]

[[tool.mypy.overrides]]
module = ["toml"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
